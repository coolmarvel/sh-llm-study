# docker compose up --build -d  →  http://localhost:8082
#   실험(손실 곡선) · 어텐션 · 생성(스트리밍) · 교재 · 노트북(브라우저 안에서 셀 실행·편집·저장, 별도 Jupyter 서버 없음)
# 데이터(코퍼스·토크나이저·체크포인트·로그)는 D 드라이브 /mnt/d/sh-llm-data (ADR-0002). 노트북 02·07 이 여기에 쓴다 → rw
services:
  dashboard:
    build: { context: ., dockerfile: dashboard/Dockerfile }
    ports: ["8082:8082"]
    volumes:
      - /mnt/d/sh-llm-data:/data
      - ./src:/app/src:ro                 # 커널이 최신 코드를 import (PYTHONPATH=/app/src)
      - ./docs:/app/docs:ro               # 교재 탭
      - ./notebooks:/app/notebooks        # 노트북 탭: 셀 저장이 파일에 반영된다
      - ./configs:/app/configs:ro         # 노트북 07 이 ../configs 를 읽는다
      - ./build/notebooks:/app/build/notebooks:ro   # verify.sh 실행본 → 셀의 초기 출력
    environment: { SHLLM_DATA_DIR: /data, SHLLM_THREADS: "8" }
    restart: unless-stopped
