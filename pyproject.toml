[project]
name = "sh-llm-study"
version = "0.1.0"
description = "LLM 개념 학습 + 밑바닥부터 소형 한글 GPT 구현 (CPU 전용)"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "이성현 (SeongHyun Lee)", email = "chungmu.xyz@gmail.com" }]
dependencies = [
    "torch>=2.4",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "nbstripout>=0.7",
    "nbformat>=5.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shllm"]

[tool.uv]
package = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # 한글 문장은 폭 계산이 달라 줄 길이 검사에서 뺀다. 포매터가 코드는 100자로 맞춘다

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
